<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding Flights – sign in</title>
<link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>
<main class="wrap">
  <div class="panel" style="max-width:24rem;margin:4rem auto">
    <h1>Wedding Flights</h1>
    <form id="login-form">
      <label>Password <input id="password" type="password" autocomplete="current-password" required autofocus></label>
      <div class="form-actions">
        <button class="btn" type="submit">Sign in</button>
        <span id="login-msg" class="muted small" role="status"></span>
      </div>
    </form>
  </div>
</main>
<script src="/static/login.js"></script>
</body>
</html>
